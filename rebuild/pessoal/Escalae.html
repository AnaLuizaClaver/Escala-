<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escalae</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#244638;font:16px system-ui}header,main,footer{max-width:1080px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:34px;font-weight:800;letter-spacing:-2px}small{display:block;color:#65756a;font-size:12px;letter-spacing:0}nav{display:flex;gap:8px;flex-wrap:wrap}button,input,select{font:inherit;border:1px solid #cdd8cd;border-radius:8px;padding:11px}button{background:#254c40;color:white;cursor:pointer}button.secondary{background:white;color:#254c40}button[aria-current=true]{background:#53794e}input,select{width:100%;background:white}label{display:block;font-size:13px;margin:12px 0}h1{font-size:38px;letter-spacing:-1px}p{color:#65756a;line-height:1.6}.hero{background:#e6eddf;padding:30px;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:20px}.panel,form{background:white;border:1px solid #e1e6dc;border-radius:14px;padding:22px;margin:18px 0}.row{padding:15px 0;border-bottom:1px solid #e9ede5;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>div{flex:1}.badge{font-size:12px;background:#eef2e8;padding:5px 10px;border-radius:20px}.note{padding:12px;background:#fff4d9;border-radius:8px}footer{font-size:12px}a{color:inherit}.stats{font-size:35px;font-weight:700}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}#notice{color:#8b3927;min-height:24px}@media(max-width:600px){header{display:block}header button{margin-top:16px}h1{font-size:30px}main{padding:16px}}</style>
<header><div class="brand">escalae<small>GESTÃO DE MINISTÉRIOS</small></div><button id="backup" class="secondary">Baixar cópia dos dados</button></header>
<main><nav id="nav"></nav><p class="note">Demonstração em memória. Os dados são descartados ao recarregar a página.</p><div id="notice" role="status"></div><div id="view"></div></main>
<footer>Suporte: <a href="mailto:projeto.escalae@gmail.com">projeto.escalae@gmail.com</a></footer>
<script>
'use strict';
const initial=()=>({version:1,church:'Minha igreja',ministries:[],people:[],events:[],schedules:[]});
let state=initial(),page='inicio';
const el=id=>document.getElementById(id),h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs={inicio:'Início',ministerios:'Ministérios',pessoas:'Pessoas',eventos:'Encontros',escalas:'Escalas',ajustes:'Configurações'};
function validate(s){if(!s||s.version!==1||typeof s.church!=='string'||s.church.length>120)throw Error('Cópia inválida.');for(const key of ['ministries','people','events','schedules']){if(!Array.isArray(s[key])||s[key].length>10000)throw Error('Cópia inválida.');const ids=new Set();for(const r of s[key]){if(!r||typeof r.id!=='string'||ids.has(r.id))throw Error('Registro inválido.');ids.add(r.id);if(key==='ministries'&&(typeof r.name!=='string'||typeof r.description!=='string'))throw Error('Ministério inválido.');if(key==='people'&&(typeof r.name!=='string'||typeof r.ministry!=='string'))throw Error('Pessoa inválida.');if(key==='events'&&(typeof r.name!=='string'||!Number.isFinite(Date.parse(r.start))||!Number.isFinite(Date.parse(r.end))||Date.parse(r.end)<=Date.parse(r.start)))throw Error('Encontro inválido.');if(key==='schedules'&&(!['pendente','confirmada','recusada'].includes(r.status)||typeof r.person!=='string'||typeof r.event!=='string'||typeof r.ministry!=='string'||typeof r.role!=='string'))throw Error('Escala inválida.');}}for(const p of s.people)if(!s.ministries.some(m=>m.id===p.ministry))throw Error('Ministério ausente.');for(const a of s.schedules)if(!s.people.some(p=>p.id===a.person&&p.ministry===a.ministry)||!s.events.some(e=>e.id===a.event))throw Error('Escala sem pessoa ou encontro.');return s;}
function save(next){validate(next);state=next;render();}
const title=(heading,body)=>'<h1>'+heading+'</h1>'+body;
const options=(items)=>items.map(x=>'<option value="'+h(x.id)+'">'+h(x.name)+'</option>').join('');
const field=(label,name,type='text')=>'<label>'+label+'<input required maxlength="120" name="'+name+'" type="'+type+'"></label>';
const choice=(label,name,items)=>'<label>'+label+'<select required name="'+name+'">'+options(items)+'</select></label>';
const form=(action,body)=>'<form data-form="'+action+'"><div class="fields">'+body+'</div><button>Salvar</button></form>';
const lookup=(key,id)=>state[key].find(x=>x.id===id)?.name||'—';
const date=s=>new Date(s).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',dateStyle:'short',timeStyle:'short'});
const list=rows=>'<section class="panel">'+(rows.join('')||'<p>Nenhum registro ainda.</p>')+'</section>';
function render(){el('nav').innerHTML=Object.entries(tabs).map(([id,name])=>'<button data-page="'+id+'" aria-current="'+(page===id)+'">'+name+'</button>').join('');let body='';
if(page==='inicio')body='<div class="hero"><small>'+h(state.church)+'</small><h1>Organização para servir.<br>Espaço para cuidar.</h1><p>Comece pelos ministérios, cadastre as pessoas e organize o próximo encontro.</p></div><div class="grid">'+[['ministries','Ministérios'],['people','Pessoas'],['schedules','Participações em escalas']].map(([k,l])=>'<article class="panel"><div class="stats">'+state[k].length+'</div><p>'+l+'</p></article>').join('')+'</div>';
if(page==='ministerios')body=title('Ministérios',list(state.ministries.map(m=>'<div class="row"><div><strong>'+h(m.name)+'</strong><p>'+h(m.description)+'</p></div></div>'))+form('ministry',field('Nome','name')+field('Descrição','description')));
if(page==='pessoas')body=title('Pessoas',list(state.people.map(p=>'<div class="row"><strong>'+h(p.name)+'</strong><span class="badge">'+h(lookup('ministries',p.ministry))+'</span></div>'))+(state.ministries.length?form('person',field('Nome','name')+choice('Ministério','ministry',state.ministries)):'<p>Cadastre um ministério primeiro.</p>'));
if(page==='eventos')body=title('Encontros', '<p>Informe os horários de São Paulo.</p>'+list(state.events.map(e=>'<div class="row"><div><strong>'+h(e.name)+'</strong><p>'+date(e.start)+' — '+date(e.end)+'</p></div></div>'))+form('event',field('Título','name')+field('Início','start','datetime-local')+field('Fim','end','datetime-local')));
if(page==='escalas')body=title('Escalas', '<p>O responsável registra aqui as respostas recebidas dos voluntários.</p>'+list(state.schedules.map(a=>'<div class="row"><div><strong>'+h(lookup('people',a.person))+'</strong><p>'+h(lookup('events',a.event))+' · '+h(a.role)+' · '+h(lookup('ministries',a.ministry))+'</p></div><select aria-label="Resposta de '+h(lookup('people',a.person))+'" data-status="'+h(a.id)+'">'+['pendente','confirmada','recusada'].map(s=>'<option '+(s===a.status?'selected':'')+'>'+s+'</option>').join('')+'</select></div>'))+(state.people.length&&state.events.length?form('schedule',choice('Pessoa','person',state.people)+choice('Encontro','event',state.events)+field('Função','role')):'<p>Cadastre pessoas e encontros para montar uma escala.</p>'));
if(page==='ajustes')body=title('Sua igreja',form('church','<label>Nome da igreja<input required maxlength="120" name="church" value="'+h(state.church)+'"></label>')+'<section class="panel"><h2>Restaurar uma cópia</h2><p>A importação substitui os dados deste navegador. Salve uma cópia antes.</p><input id="import" aria-label="Arquivo de cópia do Escalae" type="file" accept="application/json,.json"></section>');
el('view').innerHTML=body;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;el('notice').textContent='';render();}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();try{const data=Object.fromEntries(new FormData(f));for(const k in data)data[k]=String(data[k]).trim();if(Object.values(data).some(v=>!v))throw Error('Preencha todos os campos.');const next=structuredClone(state),id=crypto.randomUUID();switch(f.dataset.form){case'church':next.church=data.church;break;case'ministry':next.ministries.push({id,...data});break;case'person':next.people.push({id,...data});break;case'event':{const start=new Date(data.start+':00-03:00'),end=new Date(data.end+':00-03:00');if(!Number.isFinite(+start)||end<=start)throw Error('O fim deve ser depois do início.');next.events.push({id,name:data.name,start:start.toISOString(),end:end.toISOString()});break;}case'schedule':{const person=state.people.find(p=>p.id===data.person),event=state.events.find(v=>v.id===data.event);if(!person||!event)throw Error('Pessoa ou encontro inválido.');if(state.schedules.some(a=>a.person===person.id&&a.status!=='recusada'&&(()=>{const existing=state.events.find(v=>v.id===a.event);return existing&&Date.parse(existing.start)<Date.parse(event.end)&&Date.parse(existing.end)>Date.parse(event.start);})()))throw Error('Esta pessoa já está escalada nesse horário.');next.schedules.push({id,...data,ministry:person.ministry,status:'pendente'});break;}}save(next);el('notice').textContent='Alteração temporária em memória.';}catch(err){el('notice').textContent=err.message;}});
document.addEventListener('change',async e=>{try{if(e.target.dataset.status){const next=structuredClone(state),a=next.schedules.find(a=>a.id===e.target.dataset.status);if(e.target.value!=='recusada'){const event=next.events.find(v=>v.id===a.event);if(next.schedules.some(x=>x.id!==a.id&&x.person===a.person&&x.status!=='recusada'&&(()=>{const other=next.events.find(v=>v.id===x.event);return Date.parse(other.start)<Date.parse(event.end)&&Date.parse(other.end)>Date.parse(event.start);})()))throw Error('Esta pessoa já está escalada nesse horário.');}a.status=e.target.value;save(next);}if(e.target.id==='import'){const file=e.target.files[0];if(!file)return;if(file.size>5000000)throw Error('A cópia excede o tamanho permitido.');const restored=validate(JSON.parse(await file.text()));if(confirm('Substituir os dados atuais pela cópia selecionada?')){save(restored);el('notice').textContent='Cópia restaurada.';}}}catch(err){render();el('notice').textContent=err.message;}});
el('backup').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='escalae-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};render();
</script></html>
